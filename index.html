<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HBD Anita</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(135deg,#3a3a3a,#555,#707070,#444);
font-family:"Times New Roman",serif;
}

/* شیشه */
.glass{
position:absolute;
width:100%;
height:100%;
backdrop-filter:blur(18px);
background:rgba(255,255,255,.04);
}

/* متن وسط */
.center{
position:absolute;
z-index:100;
font-size:42px;
font-weight:600;
color:#000;
letter-spacing:3px;
text-shadow:0 0 10px rgba(255,255,255,.2);
}

/* متن های متحرک */
.fall{
position:absolute;
top:-100px;
font-size:23px;
font-weight:500;
color:silver;
opacity:.22;
white-space:nowrap;
animation:fall linear infinite;
user-select:none;
}

@keyframes fall{

0%{
transform:translateY(-120px);
opacity:0;
}

10%{
opacity:.22;
}

90%{
opacity:.22;
}

100%{
transform:translateY(115vh);
opacity:0;
}

}
</style>

</head>
<body>

<div class="glass"></div>

<div class="center">
HBD, I LOVE U ANITA
</div>

<script>

const text="HBD, I LOVE U ANITA";

for(let i=0;i<35;i++){

let span=document.createElement("div");

span.className="fall";

span.innerHTML=text;

span.style.left=Math.random()*100+"vw";

span.style.animationDuration=(18+Math.random()*12)+"s";

span.style.animationDelay=(-Math.random()*25)+"s";

document.body.appendChild(span);

}

</script>

</body>
</html>
